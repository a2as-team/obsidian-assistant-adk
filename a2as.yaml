  load_settings: config.load_settings
  LoopAgent: google.adk.agents.loop_agent.LoopAgent
  lru_cache: functools.lru_cache
  merge_notes: tools.file_tools.merge_notes
  model_flash: adk_models.model_flash
  model_flash_lite: adk_models.model_flash_lite
  model_pro: adk_models.model_pro
  new_content_crafter: new_content_craft.new_content_crafter
  os: os
  outline: tools.content_tools.outline
  outline_agent: agents.tool_agents.content.outline_agent
  Path: pathlib.Path
  quick_log: tools.write_tools.quick_log
  quick_logger_agent: agents.tool_agents.quick_log.quick_logger_agent
  read_note: tools.file_tools.read_note
  review: tools.write_tools.review
  review_agent: agents.tool_agents.review.review_agent
  root_agent: agent.root_agent
  search_agent: browse.search_agent
  search_tool: tools.browse_tools.search_tool
  SequentialAgent: google.adk.agents.sequential_agent.SequentialAgent
  SettingsConfigDict: pydantic_settings.SettingsConfigDict
  style: tools.format_tools.style
  style_agent: format.style_agent
  summarize: tools.content_tools.summarize
  summarize_agent: agents.tool_agents.content.summarize_agent
  task_plan_agent: agent.task_plan_agent
  template: tools.format_tools.template
  template_agent: format.template_agent
  ToolContext: google.adk.tools.ToolContext
  types: google.genai.types
  update_note: tools.file_tools.update_note
  vscode_specialist_agent: vscode_specialist.vscode_specialist_agent

functions:
  append_to_note:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [filename, content]
    params:
      returns: dict
  create_note:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [filename, content]
    params:
      returns: dict
  delete_note:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [filename]
    params:
      returns: dict
  exit_loop:
    type: sync
    module: obsidian_assistant.agents.sub_agents.existing_content_edit.agent
    args: [tool_context]
  get_settings:
    type: sync
    module: obsidian_assistant.config
    params:
      returns: Settings
  list_notes:
    type: sync
    module: obsidian_assistant.tools.file_tools
    params:
      returns: list[str]
  load_settings:
    type: sync
    module: obsidian_assistant.config
    params:
      returns: Settings
  merge_notes:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [source_filename, target_filename]
    params:
      returns: dict
  model_post_init:
    type: sync
    module: obsidian_assistant.config
    args: [self, __context]
  read_note:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [filename]
    params:
      returns: dict
  update_note:
    type: sync
    module: obsidian_assistant.tools.file_tools
    args: [filename, content]
    params:
      returns: dict

files:
  filepath:
    type: variable
    actions: [write, read, delete]
    params:
      caller: [open, os.path.exists, os.remove]
      alias: [f]
  source_filepath:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  target_filepath:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.exists, open]
  vault_path:
    type: variable
    actions: [read]
    params:
      caller: [os.listdir]
