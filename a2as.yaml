  append_to_note: tools.file_tools.append_to_note
  BaseSettings: pydantic_settings.BaseSettings
  breakdown: tools.content_tools.breakdown
  breakdown_agent: agents.tool_agents.content.breakdown_agent
  context_file_agent: context_file_specialist.context_file_agent
  create_note: tools.file_tools.create_note
  delete_note: tools.file_tools.delete_note
  docs_agent: browse.docs_agent
  docs_tool: tools.browse_tools.docs_tool
  existing_content_editor: existing_content_edit.existing_content_editor
  extract_key_points: content_tools.extract_key_points
  Field: pydantic.Field
  Gemini: google.adk.models.google_llm.Gemini
  google_search: google.adk.tools.google_search
  key_points_agent: agents.tool_agents.content.key_points_agent
  lint: tools.format_tools.lint
